[project]
name = "evaluation"
version = "0.3.0"
description = "Benchmark-agnostic evaluation framework for agent self-improvement"
requires-python = ">=3.12"
dependencies = [
    "agent006",
]

[tool.uv.sources]
agent006 = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["evaluation"]
