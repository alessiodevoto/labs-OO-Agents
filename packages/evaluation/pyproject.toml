[project]
name = "evaluation"
version = "0.3.0"
description = "Benchmark-agnostic evaluation framework for agent self-improvement"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "nemo_oo_agents",
]

[tool.uv.sources]
nemo_oo_agents = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["evaluation"]
