[project]
name = "nemo-oo-agents-benchmarks"
version = "0.1.0"
description = "Benchmark agents for nemo-oo-agents (SWE-bench, Terminal Bench, LoCoMo, Tau Bench, DABStep) with Harbor runner wiring"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "nemo_oo_agents",
    "click>=8.1.0",
    "pandas>=2.0.0",
]

# System dependency (not pip-installable):
#   apptainer >= 1.3  — Ubuntu: sudo apt install apptainer
#
# To run tasks end-to-end, also install the Harbor orchestrator from NVIDIA's
# internal GitLab (branch agronskiy/experimental/agent006-onboard):
#
#   git clone --branch agronskiy/experimental/agent006-onboard \
#       ssh://git@gitlab-master.nvidia.com:12051/dl/JoC/competitive_evaluation/core_evals_frameworks/harbor.git \
#       3p/harbor-nemo
#   uv pip install -e 3p/harbor-nemo
#
# harbor_agent.py (NemoOoAgentsBenchmarksHarborAgent) requires harbor at import time.
# Install the host package too so Harbor can find harbor_agent.py via import_path:
#   uv pip install -e packages/nemo-oo-agents-benchmarks
#
# See README.md → "Local development setup" for the full walkthrough.

# Runtime dependency (not on PyPI — install manually per README.md):
#   nvidia-harbor @ git+ssh://git@gitlab-master.nvidia.com:12051/dl/JoC/competitive_evaluation/core_evals_frameworks/harbor.git@agronskiy/experimental/agent006-onboard
#   uv pip install -e 3p/harbor-nemo

[project.scripts]
nemo-harbor = "nemo_oo_agents_benchmarks.runner:main"

[tool.uv.sources]
nemo_oo_agents = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["nemo_oo_agents_benchmarks"]
