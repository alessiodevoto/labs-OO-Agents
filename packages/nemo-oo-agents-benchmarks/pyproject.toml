    "sendgrid>=6.11.0",
    "scikit-image>=0.22.0",  # skimage
    "wordninja>=2.0.0",
    "holidays>=0.40",
    # Other common (various tasks)
    "regex>=2023.0.0",
    "psutil>=5.9.0",
