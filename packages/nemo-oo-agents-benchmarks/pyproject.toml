[project.scripts]
nemo-harbor = "nemo_oo_agents_benchmarks.runner:main"

[tool.uv.sources]
nemo-oo-agents = { workspace = true }

[build-system]
requires = ["hatchling>=1.26.0", "uv-dynamic-versioning>=0.14.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# See root pyproject.toml for rationale on these knobs (bump, metadata,
# fallback). Each workspace package needs its own block — they all derive
# the same version because they share git history.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
metadata = false
fallback-version = "0.2.0"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_oo_agents_benchmarks"]
