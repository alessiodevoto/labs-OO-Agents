[project]
name = "nemo-oo-agents-viewer"
version = "0.1.0"
description = "Unified trace and evaluation viewer for nemo_oo_agents"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_oo_agents_viewer"]

[tool.hatch.build.targets.wheel.force-include]
"frontend-react/dist" = "nemo_oo_agents_viewer/frontend"
