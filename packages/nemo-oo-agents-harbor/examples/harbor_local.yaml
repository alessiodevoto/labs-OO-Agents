# Harbor config for running nemo-oo-agents-harbor locally with Apptainer.
#
# Prerequisites — see README.md "Local development setup":
#   1. sudo apt install apptainer
#   2. Clone Harbor (rcabral/apptainer-agent006-nemo branch) and install:
#        git clone --branch rcabral/apptainer-agent006-nemo \
#            ssh://git@gitlab-master.nvidia.com:12051/rcabral/harbor.git \
#            3p/harbor-nemo
#        uv pip install -e 3p/harbor-nemo
#   3. Generate task dirs (see README.md "Create task directories")
#
# Required env vars:
#
#   NEMO_OO_AGENTS_GIT_URL — repo URL for cloning inside the container:
#     export NEMO_OO_AGENTS_GIT_URL="https://oauth2:<PAT>@gitlab-master.nvidia.com/interactive-agents/nemo_oo_agents.git"
#     (PAT scope: read_repository)
#
#   API keys — forwarded automatically into the container:
#     export ANTHROPIC_API_KEY="sk-ant-..."
#     # or for local vLLM:
#     export OPENAI_BASE_URL="http://localhost:8000/v1"
#     export OPENAI_API_KEY="dummy"
#
# Run:
#   harbor run --config examples/harbor_local.yaml

jobs_dir: /tmp/harbor_jobs
n_attempts: 1
timeout_multiplier: 1.0

orchestrator:
  type: local
  n_concurrent_trials: 1   # increase for parallel tasks
  quiet: false

environment:
  type: apptainer
  kwargs:
    apptainer_binary: apptainer   # system install: sudo apt install apptainer

agents:
  - name: nemo-oo-agents
    model_name: anthropic/claude-opus-4-6   # or openai/gpt-4o, etc.
    kwargs:
      agent_type: basic             # basic | opt1
      # nemo_oo_agents_git_ref: "main"   # branch / tag / SHA to check out

datasets:
  # One subdirectory per SWEBench instance.  Each subdir must contain:
  #   instruction.md          problem statement
  #   task.toml               environment config (docker_image = /path/to/<id>.sif)
  #   tests/test.sh           verifier script
  #   tests/config.json       raw task record
  #   environment/files/setup.sh   installs uvicorn/fastapi sidecar
  - path: /path/to/your/harbor_tasks/
