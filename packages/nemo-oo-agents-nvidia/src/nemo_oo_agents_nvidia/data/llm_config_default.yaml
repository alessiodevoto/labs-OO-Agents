  # Direct OpenAI route via the NVIDIA gateway (not Azure-routed). Defaults to
  # the Responses API (`client_type: responses`) since it caches ~25 pp more
  # of the prefix than the Chat Completions path on cold-cache replays
  # (2026-05-21). The three `openai/` segments are: litellm provider prefix
  # (stripped by litellm) + the gateway's `openai/openai/gpt-5.5` model id.
  gpt-5.5-direct:
    client_type: responses
    model_name: openai/openai/openai/gpt-5.5
    api_base: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INTERNAL_API_KEY
