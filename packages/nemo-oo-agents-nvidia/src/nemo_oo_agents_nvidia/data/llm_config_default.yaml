# Bundled default model registry — ships inside the nemo-oo-agents-nvidia
# wheel and is discovered by core via the `nemo_oo_agents.bundled_configs`
# entry-point group.
#
# Loaded automatically as the lowest-priority layer of the config chain
# when the package is installed. To customize, run `nemo oo config eject`
# (writes a copy to ~/.config/nemo_oo/llm_config.yaml), point
# NEMO_OO_LLM_CONFIG at a different file, or drop an llm_config.yaml in
# your project's .nemo_oo/ directory.
#
# External users who don't want these NVIDIA aliases simply don't install
# nemo-oo-agents-nvidia.
#
# Most aliases below route through NVIDIA's internal inference gateway
# (OpenAI-compatible endpoint). Set NVIDIA_INTERNAL_API_KEY (or
# NVIDIA_API_KEY for the public NIM endpoint) to use them.

models:
  # ===========================================================================
  # NVIDIA Nemotron / Qwen / GPT-OSS (reasoning models)
  # ===========================================================================
  nemotron3-nano-30b:
    model_name: openai/nvidia/nvidia/Nemotron-3-Nano-30B-A3B
    api_base: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INTERNAL_API_KEY
    context_window: 262144
    max_tokens: 65384
    reasoning_effort: medium
    max_thinking_tokens: 4096

  nemotron-3-super-preview:
    model_name: openai/nvidia/nvidia/nemotron-3-super-preview
