[project]
name = "nat-oo-agents"
version = "0.1.0"
requires-python = ">=3.12"
description = "NeMo OO Agents integration plugin for NVIDIA NeMo Agent Toolkit"
license = {text = "Apache-2.0"}
dependencies = [
    "nvidia-nat-core",
    "pydantic>=2.0.0",
    # Hard dependency: nemo_oo_agents_wrapper imports `dotenv` at module top.
    "python-dotenv>=1.0.0",
    # Soft dependency: llm.py's factories import nemo_oo_agents.unifiedllm for
    # registry-backed LLM defaults (guarded by try/except, but still required
    # for the registry-fallback feature to work).
    "nemo-oo-agents",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.entry-points.'nat.components']
nat_nemo_oo_agents = "nat.plugins.nemo_oo_agents.register"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nat.plugins.nemo_oo_agents"

# Tests live with the plugin because it depends on the NAT runtime
# (nvidia-nat-core), which the main repo deliberately excludes from its
# workspace, pyright, and root pytest testpaths. Run them from this package:
#   uv run --extra dev pytest packages/nat_oo_agents
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
