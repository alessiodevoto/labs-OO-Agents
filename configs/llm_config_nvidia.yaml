# NVIDIA-internal model registry.
#
# These models route through NVIDIA's internal inference gateway
# (OpenAI-compatible endpoint). Requires NVIDIA_INTERNAL_API_KEY
# (or NVIDIA_API_KEY for the public NIM endpoint).
#
# Usage:
#   1. Copy this file to a shared location, e.g. ~/.nemo/llm_config_nvidia.yaml
#   2. Set: export UNIFIEDLLM_CONFIG=~/.nemo/llm_config_nvidia.yaml
#   3. Models below become available via get_llm_client() and
#      as agent/scorer models in eval_pipeline configs.

models:
  # ===========================================================================
  # NVIDIA Nemotron / Qwen / GPT-OSS (reasoning models)
  # ===========================================================================
  nemotron3-nano-30b:
    model_name: openai/nvidia/nvidia/Nemotron-3-Nano-30B-A3B
    api_base: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INTERNAL_API_KEY
    context_window: 262144
    max_tokens: 65384
    reasoning_effort: medium
    max_thinking_tokens: 4096

  nemotron-3-super-preview:
    model_name: openai/nvidia/nvidia/nemotron-3-super-preview
    api_base: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INTERNAL_API_KEY
    context_window: 262144
    temperature: 0.7
    top_p: 0.7
    max_tokens: 16384

