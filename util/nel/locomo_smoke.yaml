# NEL smoke test — LoCoMo (5 tasks, nemo-oo-agents baseline)
#
# BLOCKED: LoCoMo is not in harbor's public dataset registry, so it cannot use
# harbor's --dataset flag. Running via NEL requires either:
#   (a) Adding LoCoMo to the harbor registry (upstream harbor PR), OR
#   (b) Updating the harbor framework.yml to support --path with a Lustre-mounted
#       task directory (pending harbor MR).
#
# Until one of those is done, run LoCoMo locally instead:
#   harbor run --config util/harbor/locomo_baseline.yaml \
#       --path util/harbor/tasks/locomo
#
# Task dirs (1542 tasks) are at util/harbor/tasks/locomo/ in the repo.
# Rsync to Lustre before using this config:
#   rsync -av util/harbor/tasks/locomo/ \
#       /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_reasoning/users/rcabral/harbor_tasks/locomo/
#
# The SIF is pre-built in Alex's Lustre cache — no SIF pre-pulling needed.

defaults:
  - execution: internal/slurm/cw
  - deployment: none
  - _self_

execution:
  hostname: cw-dfw-cs-001-login-02
  account: llmservice_nemo_reasoning
  output_dir: /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_reasoning/users/rcabral/benchmarks/smoke/locomo
  partition: cpu
  walltime: 02:00:00
  gres: gpu:0
  num_instances: 1
  mounts:
    evaluation:
      /lustre/fs1/portfolios/coreai/projects/coreai_dlalgo_dle/users/agronskiy/apptainer_cache: /tmp/sif-cache
      # Mount LoCoMo task dirs from Lustre once rsync'd (see above).
      /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_reasoning/users/rcabral/harbor_tasks/locomo: /tmp/locomo-tasks
    mount_home: true

target:
  api_endpoint:
    model_id: aws/anthropic/bedrock-claude-sonnet-4-5-v1
    url: https://inference-api.nvidia.com/v1/chat/completions
    type: chat
    api_key_name: NVIDIA_INTERNAL_API_KEY

evaluation:
  env_vars:
    APPTAINER_CACHEDIR: "lit:/tmp/sif-cache"
    APPTAINER_TMPDIR: "lit:/tmp/sif-cache/tmp"
    NEMO_OO_AGENTS_GIT_URL: "lit:${oc.env:NEMO_OO_AGENTS_GIT_URL}"
    NEMO_OO_AGENTS_GIT_REF: "lit:${oc.env:NEMO_OO_AGENTS_GIT_REF,main}"

  nemo_evaluator_config:
    config:
      params:
        limit_samples: 5
        parallelism: 5
        max_new_tokens: 16384
        extra:
          agent: nemo-oo-agents
          # TODO: replace with path:/tmp/locomo-tasks once framework.yml supports --path
          dataset: locomo@1.0
          n_attempts: 1
          timeout_multiplier: 1.0
          sandbox:
            execution_backend: apptainer
            config:
              apptainer_image_cache_dir: /tmp/sif-cache
              apptainer_fakeroot: false
              apptainer_timeout_s: 7200

  tasks:
    - name: harbor.locomo
      container: gitlab-master.nvidia.com/dl/joc/competitive_evaluation/nvidia-core-evals/ci-llm/harbor:2026-04-23T10-21-2868aca3
