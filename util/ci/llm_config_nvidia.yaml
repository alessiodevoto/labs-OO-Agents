    api_key_env: NVIDIA_INTERNAL_API_KEY
    context_window: 272000
    max_tokens: 64000
    reasoning:
      effort: medium

  # ===========================================================================
  # Anthropic Claude (via NVIDIA gateway)
  #
  # Routed to Bedrock (aws/…) by default. The newest Claude models route to Azure
  # (azure/…) instead: on Bedrock the gateway emits the native
  # `output_config.format` structured-output field, which those routes reject, so
  # structured outputs (Pydantic return types) fail. In each such entry the Bedrock
  # `model_name` is kept commented out to show the endpoint was not forgotten.
  # ===========================================================================
  claude-opus:
    model_name: openai/aws/anthropic/claude-opus-4-5
    api_base: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INTERNAL_API_KEY
