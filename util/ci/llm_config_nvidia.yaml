# NVIDIA model aliases for the capability-test CI gate.
#
# A copy of nemo-oo-agents-nvidia's bundled registry (that package lives in
# the nooa-dev repo since the split). The capability-test job points
# NEMO_OO_LLM_CONFIG at this file so the gate's model matrix (claude-haiku,
# nemotron3-nano-30b, ...) resolves without installing the package.
# Keep in sync with nooa-dev:packages/nemo-oo-agents-nvidia when aliases the
# gate uses change.

models:
  # ===========================================================================
  # NVIDIA Nemotron / Qwen / GPT-OSS (reasoning models)
  # ===========================================================================
  nemotron3-nano-30b:
    model_name: openai/nvidia/nvidia/Nemotron-3-Nano-30B-A3B
    api_base: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INTERNAL_API_KEY
    context_window: 262144
    max_tokens: 65384
    reasoning_effort: medium
    max_thinking_tokens: 4096

  nemotron-3-super-preview:
    model_name: openai/nvidia/nvidia/nemotron-3-super-preview
    api_base: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_INTERNAL_API_KEY
    context_window: 262144
    temperature: 0.7
    top_p: 0.7
    max_tokens: 16384

  nemotron-3-super-v3:
    model_name: openai/nvidia/nvidia/nemotron-3-super-v3
