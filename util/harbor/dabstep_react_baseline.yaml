# Harbor config for DABStep with the ReAct baseline agent (gl-70).
#
# Uses the ReAct (Thought/Action/Observation) agent instead of CodeAct.
# Compare with dabstep_baseline.yaml which uses the CodeAct baseline.
#
# Prerequisites:
#   1. apptainer installed + squashfuse (user namespace support)
#   2. Harbor installed: uv pip install -e 3p/harbor-nemo
#   3. DABStep task dirs generated: python util/harbor/generate_dabstep_tasks.py
#   4. Set env vars:
#        export NEMO_OO_AGENTS_GIT_URL="https://oauth2:<PAT>@gitlab-master.nvidia.com/..."
#        export NVIDIA_INTERNAL_API_KEY="sk-..."
#        export ANTHROPIC_API_KEY="sk-ant-..."
#
# Run:
#   harbor run --config util/harbor/dabstep_react_baseline.yaml

jobs_dir: /raid/rcabral/home/harbor_jobs/dabstep_react_baseline
n_attempts: 1
timeout_multiplier: 1.0
environment_build_timeout_multiplier: 5.0
agent_setup_timeout_multiplier: 3.0

orchestrator:
  type: local
  n_concurrent_trials: 2
  quiet: false

environment:
  type: apptainer
  override_memory_mb: 8192
  kwargs:
    apptainer_binary: /raid/rcabral/home/conda-envs/apptainer/bin/apptainer
    apptainer_fakeroot: true
    # Canonical SIF cache: ~/3p/sif_cache (outside any worktree, rsync to Lustre for sharing)
    apptainer_image_cache_dir: ~/3p/sif_cache
    env_passthrough: NVIDIA_INTERNAL_API_KEY,ANTHROPIC_API_KEY,NEMO_OO_AGENTS_GIT_URL,NEMO_OO_AGENTS_GIT_REF

agents:
  - name: nemo-oo-agents
    model_name: aws/anthropic/bedrock-claude-sonnet-4-5-v1
    kwargs:
      agent_type: react-baseline

datasets:
  - path: util/harbor/tasks/dabstep
