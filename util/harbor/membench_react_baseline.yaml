# Harbor config for MemBench with the ReAct baseline agent (gl-69).
#
# Uses the ReAct (Thought/Action/Observation) agent instead of CodeAct.
# Compare with membench_baseline.yaml which uses the CodeAct baseline.
#
# Prerequisites:
#   1. apptainer installed
#   2. Harbor installed: uv pip install -e 3p/harbor-nemo
#   3. Get MemBench data (~1.1 GB) and generate task dirs:
#      a) rsync from rcabral's DFW homedir:
#           rsync -av rcabral@cw-dfw-cs-001-login-02.cw-dfw-cs-001.hpc.nvidia.com:~/.cache/membench/ ~/.cache/membench/
#      b) Or download from Google Drive: https://drive.google.com/file/d/112Zraj4pTPH4Idph6i1uMOLA_LPFdGr0/view
#        python 3p/harbor-nemo/adapters/membench/run_adapter.py \
#            --data-dir ~/.cache/membench \
#            --task-dir util/harbor/tasks/membench
#   4. Set env vars:
#        export NEMO_OO_AGENTS_GIT_URL="https://oauth2:<PAT>@gitlab-master.nvidia.com/..."
#        export ANTHROPIC_API_KEY="sk-ant-..."
#
# Run:
#   harbor run --config util/harbor/membench_react_baseline.yaml

jobs_dir: /tmp/harbor_jobs/membench_react_baseline
n_attempts: 1
timeout_multiplier: 1.0

orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false

environment:
  type: apptainer
  override_memory_mb: 4096
  kwargs:
    apptainer_binary: apptainer
    apptainer_fakeroot: true
    apptainer_image_cache_dir: ~/3p/sif_cache  # update to your local SIF cache path
    env_passthrough: ANTHROPIC_API_KEY,NVIDIA_API_KEY,NVIDIA_INTERNAL_API_KEY,NEMO_OO_AGENTS_GIT_URL,NEMO_OO_AGENTS_GIT_REF

agents:
  - name: nemo-oo-agents
    model_name: aws/anthropic/bedrock-claude-sonnet-4-5-v1
    kwargs:
      agent_type: react-baseline

datasets:
  - path: util/harbor/tasks/membench
