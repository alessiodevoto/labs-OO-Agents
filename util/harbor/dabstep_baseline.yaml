# Harbor config for running nemo-oo-agents-benchmarks with the baseline agent on DABStep.
#
# Uses Apptainer + pre-built DABStep SIF (data baked in, pandas installed).
#
# Prerequisites:
#   1. apptainer installed + squashfuse (user namespace support)
#   2. Harbor installed: uv pip install -e 3p/harbor-nemo
#   3. DABStep task dirs generated: python util/harbor/generate_dabstep_tasks.py
#   4. Set env vars:
#      export NEMO_OO_AGENTS_GIT_URL="https://oauth2:<PAT>@gitlab-master.nvidia.com/..."
#      export NVIDIA_INTERNAL_API_KEY="sk-..."
#      export ANTHROPIC_API_KEY="sk-ant-..."
#
# Run (5 tasks):
#   harbor run --config util/harbor/dabstep_baseline.yaml
#
# Run (all 10 tasks):
#   harbor run --config util/harbor/dabstep_baseline.yaml --dataset path:tasks/dabstep/all

jobs_dir: /tmp/harbor_jobs/dabstep_baseline
n_attempts: 1
timeout_multiplier: 1.0

orchestrator:
  type: local
  n_concurrent_trials: 2   # Run 2 tasks in parallel
  quiet: false

# DABStep uses a custom pre-built SIF with data baked in.
# The SIF is built from 3p/dabstep.def using:
#   apptainer build --fakeroot ~/3p/sif_cache/dabstep.sif 3p/dabstep.def
environment:
  type: apptainer
  override_memory_mb: 8192
  kwargs:
    apptainer_binary: /raid/rcabral/home/conda-envs/apptainer/bin/apptainer
    apptainer_fakeroot: true   # required: directory-backed overlay needs fakeroot in setuid mode (see #135)
    # Canonical SIF cache: ~/3p/sif_cache (outside any worktree, rsync to Lustre for sharing)
    apptainer_image_cache_dir: ~/3p/sif_cache
    env_passthrough: NVIDIA_INTERNAL_API_KEY,ANTHROPIC_API_KEY,NEMO_OO_AGENTS_GIT_URL,NEMO_OO_AGENTS_GIT_REF

agents:
  - name: nemo-oo-agents
    model_name: aws/anthropic/bedrock-claude-sonnet-4-5-v1
    kwargs:
      agent_type: baseline

datasets:
  # DABStep dev tasks — generate with: python adapters/dabstep/run_adapter.py --split dev --output-dir util/harbor/tasks/dabstep_dev
  # Override at runtime: harbor run ... --path util/harbor/tasks/dabstep_dev
  - path: util/harbor/tasks/dabstep
