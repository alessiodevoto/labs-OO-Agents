# Harbor config for Terminal Bench 1.0 — Docker mode, CodeAct baseline, ultra model.
jobs_dir: /localhome/local-rcabral/harbor_jobs/terminal_bench_local_docker_specialized_ultra
n_attempts: 1
timeout_multiplier: 1.5
environment_build_timeout_multiplier: 8.0
agent_setup_timeout_multiplier: 5.0
verifier_timeout_multiplier: 3.0

orchestrator:
  type: local
  n_concurrent_trials: 8
  quiet: false

environment:
  type: docker
  env:
    NVIDIA_INTERNAL_API_KEY: "${NVIDIA_INTERNAL_API_KEY}"
    NEMO_OO_AGENTS_GIT_URL: "${NEMO_OO_AGENTS_GIT_URL}"
    OPENAI_BASE_URL: "https://inference-api.nvidia.com/v1"
    OPENAI_API_KEY: "${NVIDIA_INTERNAL_API_KEY}"
  mounts_json:
    - type: bind
      source: /localhome/local-rcabral/3p/harbor_bootstrap_overlay/opt/harbor
      target: /opt/harbor
      read_only: true
    - type: bind
      source: /localhome/local-rcabral/3p/harbor_bootstrap_overlay/installed-agent
      target: /installed-agent

agents:
  - name: nemo-oo-agents
    model_name: nvidia/nvidia/nemotron-3-ultra-preview
    kwargs:
      agent_type: terminal-bench-1

datasets:
  - path: util/harbor/tasks/terminal_bench