# Harbor config for running MemBench with the baseline agent.
#
# MemBench: Long-term conversational memory benchmark (ACL 2025).
# Two scenarios (participation/observation), 7+ question types, MC A/B/C/D.
# Paper: https://arxiv.org/abs/2506.21605
#
# Prerequisites:
#   1. apptainer installed
#   2. Harbor installed: uv pip install -e 3p/harbor-nemo
#   3. Get MemBench data (~1.1 GB) from Lustre (no Google Drive auth needed):
#        rsync -av rcabral@cw-dfw-cs-001-login-02.cw-dfw-cs-001.hpc.nvidia.com:\
#          /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_reasoning/users/rcabral/benchmark_data/membench/ \
#          ~/.cache/membench/
#      Or Google Drive (backup): https://drive.google.com/file/d/112Zraj4pTPH4Idph6i1uMOLA_LPFdGr0/view
#   4. Get task dirs — either generate from data:
#        python 3p/harbor-nemo/adapters/membench/run_adapter.py \
#            --data-dir ~/.cache/membench \
#            --task-dir util/harbor/tasks/membench
#      Or rsync pre-generated tasks from Lustre (faster, 4779 tasks, ~270 MB):
#        rsync -av rcabral@cw-dfw-cs-001-login-02.cw-dfw-cs-001.hpc.nvidia.com:\
#          /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_reasoning/users/rcabral/harbor_tasks/membench/ \
#          util/harbor/tasks/membench/
#   5. Set env vars:
#        export NEMO_OO_AGENTS_GIT_URL="https://oauth2:<PAT>@gitlab-master.nvidia.com/..."
#        export ANTHROPIC_API_KEY="sk-ant-..."
#
# Run:
#   harbor run --config util/harbor/membench_baseline.yaml
#
# Smoke test (5 tasks):
#   python 3p/harbor-nemo/adapters/membench/run_adapter.py \
#       --data-dir /path/to/membench_data \
#       --task-dir /tmp/membench_smoke \
#       --scenarios first --question-types simple --limit 5
#   harbor run --config util/harbor/membench_baseline.yaml \
#       --dataset path:/tmp/membench_smoke

jobs_dir: /raid/rcabral/home/harbor_jobs/membench_baseline
n_attempts: 1
timeout_multiplier: 1.0
environment_build_timeout_multiplier: 8.0  # build_timeout_sec=120 → 960s; some tasks install 100+ apt packages
agent_setup_timeout_multiplier: 5.0  # 360s × 5.0 = 1800s; uv sync under high system load can take 25+ min

orchestrator:
  type: local
  n_concurrent_trials: 6
  quiet: false

environment:
  type: apptainer
  override_memory_mb: 4096
  kwargs:
    apptainer_binary: /raid/rcabral/home/conda-envs/apptainer/bin/apptainer
    apptainer_fakeroot: true   # required for runuser inside container; needs AppArmor userns allowed (see #135)
    apptainer_image_cache_dir: ~/3p/sif_cache  # update to your local SIF cache path
    env_passthrough: ANTHROPIC_API_KEY,NVIDIA_API_KEY,NVIDIA_INTERNAL_API_KEY,NEMO_OO_AGENTS_GIT_URL,NEMO_OO_AGENTS_GIT_REF

agents:
  - name: nemo-oo-agents
    model_name: aws/anthropic/bedrock-claude-sonnet-4-5-v1
    kwargs:
      agent_type: baseline
      # nooa_git_ref: "main"

datasets:
  # MemBench tasks — generated from downloaded data (see Prerequisites above).
  # Generate with: python 3p/harbor-nemo/adapters/membench/run_adapter.py
  - path: util/harbor/tasks/membench
