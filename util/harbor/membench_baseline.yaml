# Harbor config for running MemBench with the baseline agent.
#
# MemBench: fact-update recall benchmark — tests whether the agent uses the
# most recent version of a fact after seeing it updated in a distractor stream.
#
# Prerequisites:
#   1. apptainer installed (sudo apt install apptainer)
#   2. Harbor installed: uv pip install -e 3p/harbor-nemo
#   3. MemBench task dirs generated:
#        python 3p/harbor-nemo/adapters/membench/run_adapter.py \
#            --task-dir util/harbor/tasks/membench
#   4. Set env vars:
#        export NEMO_OO_AGENTS_GIT_URL="https://oauth2:<PAT>@gitlab-master.nvidia.com/..."
#        export ANTHROPIC_API_KEY="sk-ant-..."
#
# Run (all 8 tasks):
#   harbor run --config util/harbor/membench_baseline.yaml
#
# Run (high-valence facts only — health + security):
#   harbor run --config util/harbor/membench_baseline.yaml \
#       --dataset path:util/harbor/tasks/membench \
#       --filter "tags:health OR tags:security"

jobs_dir: /tmp/harbor_jobs/membench_baseline
n_attempts: 1
timeout_multiplier: 1.0

orchestrator:
  type: local
  n_concurrent_trials: 4   # All 8 tasks are lightweight (no data downloads)
  quiet: false

environment:
  type: apptainer
  kwargs:
    apptainer_binary: apptainer

agents:
  - name: nemo-oo-agents
    model_name: anthropic/claude-sonnet-4-6
    kwargs:
      agent_type: baseline
      # nemo_oo_agents_git_ref: "main"

datasets:
  # 8 MemBench tasks — one per fact template.
  # Generate with: python 3p/harbor-nemo/adapters/membench/run_adapter.py
  - path: util/harbor/tasks/membench
