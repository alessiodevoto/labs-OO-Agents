# Harbor config for re-running 55 failed TB1 tasks from baseline × sonnet run
# These tasks failed due to agent setup timeout during concurrent venv extraction

jobs_dir: ~/harbor_jobs/terminal_bench_failed_rerun
n_attempts: 1
timeout_multiplier: 1.5
environment_build_timeout_multiplier: 10.0  # 10x default for slow setup
agent_setup_timeout_multiplier: 10.0       # 10x default (was 5x, still failed)
verifier_timeout_multiplier: 2.0

orchestrator:
  type: local
  n_concurrent_trials: 1  # Run sequentially to avoid venv race condition
  quiet: false

environment:
  type: docker
  env:
    NVIDIA_INTERNAL_API_KEY: "${NVIDIA_INTERNAL_API_KEY}"
  mounts_json:
    - type: bind
      source: ~/3p/harbor_bootstrap_overlay/opt/harbor
      target: /opt/harbor
      read_only: true
    - type: bind
      source: ~/3p/harbor_bootstrap_overlay/installed-agent
      target: /installed-agent

agents:
  - name: nemo-oo-agents
    model_name: aws/anthropic/bedrock-claude-sonnet-4-5-v1
    kwargs:
      agent_type: baseline
      tools: terminal-bench

datasets:
  - path: util/harbor/tasks/tb1_failed_subset
