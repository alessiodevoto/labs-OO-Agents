# Harbor config for running LoCoMo with the baseline agent.
#
# LoCoMo: Long-term Conversational Memory benchmark (ACL 2024).
# 10 conversations (~600 turns, ~16K tokens each), 5 question types.
# Scored by token-level F1 (0.0–1.0); pass threshold F1 >= 0.5.
# Paper: https://arxiv.org/abs/2402.17753
#
# Prerequisites:
#   1. apptainer installed
#   2. Harbor installed: uv pip install -e 3p/harbor-nemo
#   3. Get task dirs — either generate locally (downloads locomo10.json automatically):
#        python 3p/harbor-nemo/adapters/locomo/run_adapter.py \
#            --task-dir util/harbor/tasks/locomo
#      Or rsync pre-generated tasks from Lustre (faster, 1542 tasks, ~176 MB):
#        rsync -av rcabral@cw-dfw-cs-001-login-02.cw-dfw-cs-001.hpc.nvidia.com:\
#          /lustre/fsw/portfolios/llmservice/projects/llmservice_nemo_reasoning/users/rcabral/harbor_tasks/locomo/ \
#          util/harbor/tasks/locomo/
#   4. Set env vars:
#        export NEMO_OO_AGENTS_GIT_URL="https://oauth2:<PAT>@gitlab-master.nvidia.com/..."
#        export ANTHROPIC_API_KEY="sk-ant-..."
#
# Run:
#   harbor run --config util/harbor/locomo_baseline.yaml
#
# Smoke test (5 single-hop tasks):
#   python 3p/harbor-nemo/adapters/locomo/run_adapter.py \
#       --task-dir util/harbor/tasks/locomo_smoke \
#       --question-types single-hop --limit 5
#   harbor run --config util/harbor/locomo_baseline.yaml \
#       --path util/harbor/tasks/locomo_smoke

jobs_dir: /tmp/harbor_jobs/locomo_baseline
n_attempts: 1
timeout_multiplier: 1.0
environment_build_timeout_multiplier: 5.0  # build_timeout_sec=120 → 600s
agent_setup_timeout_multiplier: 3.0  # 360s × 3.0 = 1080s; uv sync + full install takes 8–15 min

orchestrator:
  type: local
  n_concurrent_trials: 4
  quiet: false

environment:
  type: apptainer
  override_memory_mb: 4096
  kwargs:
    apptainer_binary: /raid/rcabral/home/conda-envs/apptainer/bin/apptainer
    apptainer_fakeroot: true   # required for runuser inside container; needs AppArmor userns allowed (see #135)
    apptainer_image_cache_dir: ~/3p/sif_cache  # update to your local SIF cache path
    env_passthrough: ANTHROPIC_API_KEY,NVIDIA_API_KEY,NVIDIA_INTERNAL_API_KEY,NEMO_OO_AGENTS_GIT_URL,NEMO_OO_AGENTS_GIT_REF

agents:
  - name: nemo-oo-agents
    model_name: aws/anthropic/bedrock-claude-sonnet-4-5-v1
    kwargs:
      agent_type: baseline
      # nemo_oo_agents_git_ref: "main"

datasets:
  # LoCoMo tasks — generated automatically (locomo10.json downloaded on first run).
  # Generate with: python 3p/harbor-nemo/adapters/locomo/run_adapter.py
  - path: util/harbor/tasks/locomo
