# Minimal NeMo OO Agents + NAT config.
# Agent uses its own LLM, no NAT tools.
#
# Usage:
#   nat run --config_file examples/nat/config_standalone.yml --input "Hello!"

workflow:
  _type: nooa_wrapper
  dependencies:
    - ../../src
  agent: example_agent_standalone.py:StandaloneAgent
  method: chat
  env: ../../.env
  description: "Standalone NeMo OO Agents agent with its own LLM"
