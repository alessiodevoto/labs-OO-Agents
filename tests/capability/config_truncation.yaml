    data_file: tests/capability/data/truncation_size_v6_total_comment_first.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  - name: truncation_size_v7_len_attr
    description: "Python len= convention: [a, b, ..., y, z]  # len=100"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_size_v7_len_attr.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0
  # ---- TEST 15: <type len=N> pattern across container types ----
  # Validates the pattern generalizes beyond lists:
  # <dict len=N>{...}</dict>, <Pydantic ...>, deeply nested, JSON-shaped.

  - name: truncation_size_v3_dict
    description: "<dict len=N>{...}</dict> — direct dict counting"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
