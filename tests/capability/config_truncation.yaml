    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  - name: truncation_nested_partial_after
    description: "Same, with <preview> wrapper"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_nested_partial_after.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  # ---- TEST 7: pydantic_field (extract a field from a Pydantic-style instance) ----

  - name: truncation_pydantic_field_before
    description: "Extract a field from a Foo(field=value) instance; some have a truncated list field"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_pydantic_field_before.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  - name: truncation_pydantic_field_after
    description: "Same; the truncated-field case wears a <preview> wrapper"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_pydantic_field_after.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  # ---- TEST 8: pydantic_shallow (refuse when instance is depth-truncated to Foo(...)) ----

  - name: truncation_pydantic_shallow_before
    description: "Refuse when Pydantic instance is shown shallow as Foo(...) (no wrapper)"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_pydantic_shallow_before.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  - name: truncation_pydantic_shallow_after
    description: "Same, with <preview> wrapper"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_pydantic_shallow_after.jsonl
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

  # ---- TEST 9: string_head (find content in the visible head of a truncated string) ----

  - name: truncation_string_head_before
    description: "Find a phrase in pprint's 'foo'+N string-truncation idiom (today)"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_string_head_before.jsonl
    scorers:
      - name: substring_match
        class: LLMJudgeScorer
        weight: 1.0
        model: nemotron3-nano-30b
        rubric: |
          Does the answer mention or contain the expected phrase?

          Answer: {output}
          Expected phrase: {expected}

          Pass=true if the expected phrase appears verbatim or is clearly the
          core of the answer. Pass=false if UNKNOWN or hallucinated.

  - name: truncation_string_head_after
    description: "Find a phrase in <truncated> head (3.0)"
    tier: stable
    agent:
      module: tests.capability.agents.truncation_comprehension
      class: TruncationComprehensionAgent
    method: answer
    data_file: tests/capability/data/truncation_string_head_after.jsonl
    scorers:
      - name: substring_match
        class: LLMJudgeScorer
        weight: 1.0
        model: nemotron3-nano-30b
        rubric: |
          Does the answer mention or contain the expected phrase?

          Answer: {output}
          Expected phrase: {expected}

          Pass=true if the expected phrase appears verbatim or is clearly the
          core of the answer. Pass=false if UNKNOWN or hallucinated.

  # ---- TEST 10: string_partial (refuse when content is in elided portion of a long string) ----

  - name: truncation_string_partial_before
    description: "Refuse when target is in elided portion of pprint's 'foo'+N string"
    tier: stable
    agent:
