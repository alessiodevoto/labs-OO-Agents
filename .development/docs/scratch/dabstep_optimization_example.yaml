# Example: DABStep Optimization Config
# This config uses DABStepContextProvider with solution docs

name: dabstep
description: DABStep payment processing - optimize full agent architecture

# Optimization settings
optimization:
  n_runs: 3                # Run each test 3 times for consistency
  n_samples: 5             # Sample 5 frontier failures for reflection
  compact_traces: true     # Use compact trace rendering
  max_trace_lines: 1500    # Longer traces for DABStep (more complex)

  # Reflection settings
  reflect_model: openai/aws/anthropic/claude-opus-4-5
  reflect_temperature: 0.7
  reflect_api_base: https://inference-api.nvidia.com/v1
  reflect_api_key_env: NVIDIA_INFERENCE_API_KEY
  reflect_max_tokens: 16000  # Larger context for solution docs

  # Optional: Use custom prompt template (includes {benchmark_context} placeholder)
  # prompt_template: reflection_prompt.md.template

# What files to optimize (full agent stack, not just prompts!)
target_files:
  - agents/dabstep_agent.py       # Main agent
  - agents/rules_lawyer.py        # Subagent for rule interpretation
  - agents/solution_verifier.py   # Subagent for answer validation

# Output directory
output_dir: results

# Pass threshold for accept/reject (70% - DABStep is harder)
pass_threshold: 0.7

# Agent models to test
agent_models:
  - qwen3-80b

# Model configurations
models:
  qwen3-80b:
    model_name: openai/qwen/qwen3-next-80b-a3b-instruct
    endpoint: https://integrate.api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    max_tokens: 16384

# Test suite (using DABStep adapter)
test_suite:
  - name: dabstep_easy
    description: DABStep easy-level questions
    agent:
      module: agents.dabstep_agent
      class: DABStepAgent
    method: answer_question
    data_file: ~/.cache/dabstep/data/easy_samples.jsonl  # Sample from HF dataset
    scorers:
      - name: exact_match
        class: ExactMatchScorer
        weight: 1.0

