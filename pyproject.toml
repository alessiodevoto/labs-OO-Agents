    # Core scientific computing (334+ tasks)
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    # Visualization (314+ tasks)
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    # ML/Statistics (182+ tasks)
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    # NLP (31+ tasks)
    "nltk>=3.8.0",
    "wordcloud>=1.9.0",
    # Web/HTTP (40+ tasks)
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    # Date/Time (16+ tasks)
    "pytz>=2023.3",
    "python-dateutil>=2.8.0",
    # Image processing (10+ tasks)
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    # Crypto (7+ tasks)
    "cryptography>=41.0.0",
    "rsa>=4.9",
    # Flask ecosystem (5+ tasks)
    "flask>=2.3.0",
    "flask-restful>=0.3.10",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    # Django (4+ tasks)
    "django>=4.2.0",
    # Wikipedia API (1+ tasks)
    "wikipedia>=1.4.0",
    # Document processing (6+ tasks)
    "python-docx>=1.1.0",  # docx
    "openpyxl>=3.1.0",
    "xlwt>=1.3.0",
    # Mapping/Geo (6+ tasks)
    "folium>=0.15.0",
    "geopy>=2.4.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    # ML/Deep Learning (6+ tasks)
    "keras>=3.0.0",
    "tensorflow>=2.15.0",
    # NLP additional (5+ tasks)
    "textblob>=0.18.0",
    "gensim>=4.3.0",
    # Data utilities (4+ tasks)
    "faker>=22.0.0",
    "texttable>=1.7.0",
    "xmltodict>=0.13.0",
    # Math/Science (3+ tasks)
