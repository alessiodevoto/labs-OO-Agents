[project]
name = "nemo-oo-agents"
version = "0.1.0"
description = "Code-generating agent orchestration system with event sourcing and serialized execution"
license = {text = "Apache-2.0"}
readme = "README.md"
authors = [
    {name = "NVIDIA NeMo Team"}
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "unifiedllm",
    "context-blocks",
    "ipython>=9.12.0",
    "platformdirs>=4.9.4",
    # from mcp-nemo-oo-agents (now internal)
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "openinference-instrumentation-litellm>=0.1.30",
]

[project.scripts]
nemo = "nemo_oo_agents_cli:main"
trace-explorer = "nemo_oo_agents.trace_explorer:main"

[project.entry-points."nemo_oo_tui.skills_dirs"]
sw_skills = "nemo_oo_agents_cli.tui:_get_sw_skills_dir"

[tool.uv.sources]
unifiedllm = { workspace = true }
context-blocks = { workspace = true }
eval_pipeline = { workspace = true }
nemo-oo-agents-benchmarks = { workspace = true }
# nvidia-nat-nemo-oo-agents: external plugin, not in workspace

[tool.uv]
# Extra index URLs to search for packages (in addition to PyPI)
# Ignore packages uploaded less than 7 days ago to mitigate supply-chain attacks
exclude-newer = "2026-05-01T00:00:00Z"
# litellm requires python <3.14; skip impossible 3.14+ resolution splits
environments = [
    "python_full_version >= '3.12' and python_full_version < '3.14'",
]

[tool.uv.workspace]
members = [
    "packages/unifiedllm",
    "packages/context-blocks",
    "util/eval_pipeline",
    "packages/nemo-oo-agents-benchmarks",
]


[project.optional-dependencies]
tracing = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "openinference-instrumentation>=0.1.42",
    "openinference-semantic-conventions>=0.1.9",
    "openinference-instrumentation-litellm>=0.1.28",
]
viewer = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.5",
    "pyyaml>=6.0",
]
# trace_explorer is now nemo_oo_agents.trace_explorer (internal, no extra deps)
sandbox = [
    "openshell",
]
# mcp is now nemo_oo_agents.mcp (deps in main dependencies)
# Scientific / plotting stack pre-loaded into the TUI agent REPL (np, pd, px, go, scipy, sklearn)
tui = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
]
# Everything needed for `nemo oo term` — web terminal + plotting stack
term = [
    "nemo-oo-agents[tui]",
    "uvicorn[standard]>=0.34.0",
    "ptyprocess>=0.7.0",
]
nemo-oo-agents-benchmarks = [
    "nemo-oo-agents-benchmarks",
]
# nemo-flow is NOT listed as an optional dep because uv locks all extras
# unconditionally, and nemo-flow lives on a private registry that requires auth.
# This would block `uv sync` / `uv lock` for everyone without credentials.
# Install manually:
#   uv auth login gitlab-master.nvidia.com --username __token__ --password $GITLAB_TOKEN
#   uv pip install nemo-flow --index-url https://gitlab-master.nvidia.com/api/v4/projects/230591/packages/pypi/simple
# BigCodeBench dependencies (libraries used across 1140 benchmark tasks)
bigcodebench = [
    "llvmlite>=0.46.0",
    # Core scientific computing (334+ tasks)
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    # Visualization (314+ tasks)
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    # ML/Statistics (182+ tasks)
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    # NLP (31+ tasks)
    "nltk>=3.8.0",
    "wordcloud>=1.9.0",
    # Web/HTTP (40+ tasks)
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    # Date/Time (16+ tasks)
    "pytz>=2023.3",
    "python-dateutil>=2.8.0",
    # Image processing (10+ tasks)
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    # Crypto (7+ tasks)
    "cryptography>=41.0.0",
    "rsa>=4.9",
    # Flask ecosystem (5+ tasks)
    "flask>=2.3.0",
    "flask-restful>=0.3.10",
    "flask-login>=0.6.3",
    "flask-mail>=0.10.0",
    # Django (4+ tasks)
    "django>=4.2.0",
    # Wikipedia API (1+ tasks)
    "wikipedia>=1.4.0",
    # Document processing (6+ tasks)
    "python-docx>=1.1.0",  # docx
    "openpyxl>=3.1.0",
    "xlwt>=1.3.0",
    # Mapping/Geo (6+ tasks)
    "folium>=0.15.0",
    "geopy>=2.4.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    # ML/Deep Learning (6+ tasks)
    "keras>=3.0.0",
    "tensorflow>=2.15.0",
    # NLP additional (5+ tasks)
    "textblob>=0.18.0",
    "gensim>=4.3.0",
    # Data utilities (4+ tasks)
    "faker>=22.0.0",
    "texttable>=1.7.0",
    "xmltodict>=0.13.0",
    # Math/Science (3+ tasks)
    "sympy>=1.12.0",
    # Audio (2+ tasks)
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    # Web scraping (2+ tasks)
    "mechanize>=0.4.0",
    # Flask forms (2+ tasks)
    "flask-wtf>=1.2.0",
    "wtforms>=3.1.0",
    "werkzeug>=3.0.0",
    # Misc (1-2 tasks each)
    "pycryptodome>=3.20.0",  # Crypto
    "python-Levenshtein>=0.25.0",
    "blake3>=0.4.0",
    "natsort>=8.4.0",
    "prettytable>=3.10.0",
    "pyquery>=2.0.0",
    "pytesseract>=0.3.10",
    "sendgrid>=6.11.0",
    "scikit-image>=0.22.0",  # skimage
    "wordninja>=2.0.0",
    "holidays>=0.40",
    # Other common (various tasks)
    "regex>=2023.0.0",
    "psutil>=5.9.0",
    "lxml>=4.9.0",
    "pyyaml>=6.0.0",
    "chardet>=5.0.0",
]
tui-optional = [
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "plotly>=6.6.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["nemo_oo_agents", "nemo_oo_agents_cli"]

[dependency-groups]
trace-viewer = [
    "uvicorn>=0.38.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.123.4",
    "pyyaml>=6.0.0",
    "watchfiles>=1.0.0",
    "python-multipart>=0.0.20",
]
dev = [
    {include-group = "trace-viewer"},
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-rerunfailures>=14.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.7.0",
    "ruff>=0.14.14",
    "httpx[socks]>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.39.1",
    "eval_pipeline",
    "pre-commit>=4.5.0",
    "pyright>=1.1.408",
    "pytest-cov>=7.1.0",
    "pyte>=0.8.2",
    "ptyprocess>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests",
    "tests/agentdoc",
    "tests/viewer",
    "packages/context-blocks/tests",
    "packages/unifiedllm/tests",
    "tests/tracing",
    "tests/test_mcp",
    "packages/nemo-oo-agents-benchmarks/tests",
    "tests/trace_explorer",
]
pythonpath = [
    "src",
    "packages/context-blocks/src",
    "packages/unifiedllm/src",
    "packages/nemo-oo-agents-benchmarks/src",
]
addopts = "-v --tb=short --import-mode=importlib -m 'not integration and not stress'"
markers = [
    "integration: marks tests as integration tests that make real API calls (run with '-m integration')",
    "stress: marks tests as stress/load tests that simulate high concurrency (run with '-m stress')",
]
filterwarnings = [
    "ignore::DeprecationWarning:litellm.*",
    "ignore::DeprecationWarning:aiohttp.*",
    "ignore:coroutine.*was never awaited:RuntimeWarning",
    "ignore:Pydantic serializer warnings:UserWarning",
    "ignore::FutureWarning:nemo_oo_agents.strategies",
]

[tool.coverage.run]
source = ["src/nemo_oo_agents", "src/nemo_oo_agents_cli"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.mypy]
python_version = "3.12"
strict = true
warn_no_return = true
warn_unreachable = true
# Disable call-arg errors for __init_subclass__ (PEP 487 keyword arguments)
# return and body errors for ellipsis methods
disable_error_code = ["empty-body", "return", "call-arg"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["worktrees", ".vscode-server"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]  # Notebooks often have config before imports
# Agent files need module-level imports for LLM-generated code (via ExecutionNamespaceBuilder)
"experiments/evaluation-ablations/agents/*.py" = ["F401", "RUF100"]
# Tests intentionally use legacy typing syntax (Optional[X], Union[X,Y], Generic[T])
# to verify that _get_complex_type() handles those annotation forms correctly.
"tests/test_pure_functions_gl105.py" = ["UP007", "UP045", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["nemo_oo_agents", "eval_pipeline", "evaluation", "unifiedllm", "agentdoc", "context_blocks"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# Resolve workspace packages when IDE uses project root (same as pytest pythonpath)
extraPaths = [
    "src",
    "packages/unifiedllm/src",
    "packages/context-blocks/src",
]
include = [
    "src",
    "packages"
]
exclude = []
# Pydantic discriminated unions require narrowing event_type in subclasses
reportIncompatibleVariableOverride = false
