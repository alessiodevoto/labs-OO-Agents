#
# agent006 sandbox policy.
#
# Based on the NemoClaw default policy (deploy/docker/sandbox/dev-sandbox-policy.yaml).
# Sections that differ from the default are marked with [agent006].

version: 1

# --- Sandbox setup configuration (queried once at startup) ---

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

# --- Network policies (queried per-CONNECT request) ---
#
# Each named policy maps a set of allowed (binary, endpoint) pairs.
# Binary identity is resolved via /proc/net/tcp inode lookup + /proc/{pid}/exe.
# Ancestors (/proc/{pid}/status PPid walk) and cmdline paths are also matched.
# SHA256 integrity is enforced in Rust via trust-on-first-use, not here.

network_policies:
  # Unchanged from default.
  claude_code:
    name: claude-code
    endpoints:
      - { host: api.anthropic.com, port: 443, protocol: rest, enforcement: enforce, access: full, tls: terminate }
      - { host: statsig.anthropic.com, port: 443 }
      - { host: sentry.io, port: 443 }
      - { host: raw.githubusercontent.com, port: 443 }
      - { host: platform.claude.com, port: 443 }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/node }

  # Unchanged from default.
  github_ssh_over_https:
    name: github-ssh-over-https
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        rules:
          # Git Smart HTTP read-only: allow clone, fetch, pull
          # Discovery (query string is included in path matching)
          - allow:
              method: GET
              path: "/**/info/refs*"
          # Data transfer for reads (all repos)
          - allow:
              method: POST
              path: "/**/git-upload-pack"
          # Data transfer for writes
          # - allow:
          #    method: POST
          #    path: "/**/git-receive-pack"
    binaries:
      - { path: /usr/bin/git }

  # Unchanged from default.
  github_rest_api:
    name: github-rest-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        access: read-only
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/gh }

  # [agent006] Expanded from default.
  # Default allows integrate.api.nvidia.com for curl, bash, and opencode.
  # agent006 adds:
  #   - inference.nvidia.com: alternate NVIDIA NIM endpoint used by some agents.
  #   - inference-api.nvidia.com: internal cluster endpoint; IP-pinned because
  #     the cluster name may not be resolvable outside NVIDIA DNS, and pinning
  #     prevents accidental resolution to a public IP.
  #   - Python binary paths: agent006 workflows call inference APIs from Python
  #     scripts (not only from shell or opencode). Multiple paths are required
  #     because uv creates venvs with versioned interpreter symlinks
  #     (e.g. python3.12) that resolve to a different /proc/{pid}/exe path than
  #     the symlink itself. uv python install places managed interpreters under
  #     /sandbox/.uv/python/** with version + platform hashes in the path.
  nvidia_inference:
    name: nvidia-inference
    endpoints:
      - { host: integrate.api.nvidia.com, port: 443 }
      - { host: inference.nvidia.com, port: 443 }
      # [agent006] Internal inference cluster — IP-pinned to prevent
      # DNS-based redirection outside the NVIDIA datacenter network.
      - { host: inference-api.nvidia.com, port: 443, allowed_ips: ["10.48.202.0/24", "10.48.203.0/24"] }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /bin/bash }
      - { path: /usr/bin/bash }
      - { path: /usr/local/bin/opencode }
      # [agent006] Python callers in agent scripts and venv entry points.
      - { path: /usr/local/bin/python }
      - { path: /usr/local/bin/python3 }
      # Versioned Python binaries — nemoclaw resolves /proc/{pid}/exe through
      # venv symlinks, so the real interpreter path must be listed explicitly.
      - { path: "/usr/local/bin/python3.*" }
      # uv-managed Python installations (uv python install)
      - { path: "/sandbox/.uv/python/**" }
      - { path: /sandbox/.venv/bin/python }
      - { path: /sandbox/.venv/bin/python3 }
      # agent006 CLI entry point (installed into the sandbox venv)
      - { path: /sandbox/.venv/bin/agent006 }

  # [agent006] Expanded from default.
  # Default allows pypi.org, files.pythonhosted.org, github.com,
  # objects.githubusercontent.com, api.github.com, and downloads.python.org.
  # agent006 adds urm.nvidia.com: the NVIDIA internal Artifactory mirror for
  # PyPI. Packages that are not yet on public PyPI (or internal forks) are
  # published here. IP-pinned to the known Artifactory node IPs to prevent
  # traffic from escaping the internal network if DNS changes.
  pypi:
    name: pypi
    endpoints:
      - { host: pypi.org, port: 443 }
      - { host: files.pythonhosted.org, port: 443 }
      # uv python install downloads from python-build-standalone on GitHub
      - { host: github.com, port: 443 }
      - { host: objects.githubusercontent.com, port: 443 }
      # uv resolves python-build-standalone release metadata via the GitHub API
      - { host: api.github.com, port: 443 }
      - { host: downloads.python.org, port: 443 }
      # [agent006] NVIDIA internal Artifactory PyPI mirror.
      # IP-pinned to prevent resolution outside the internal network.
      - { host: urm.nvidia.com, port: 443, allowed_ips: ["10.121.10.15/32", "10.121.10.18/32", "10.121.10.19/32", "10.121.10.24/32", "10.121.10.20/32", "10.121.10.22/32", "10.121.10.23/32", "10.121.10.21/32"] }
    binaries:
      # [agent006] Python callers in agent scripts and venv entry points.
      - { path: /usr/local/bin/python }
      - { path: /usr/local/bin/python3 }
      # Versioned Python binaries — nemoclaw resolves /proc/{pid}/exe through
      # venv symlinks, so the real interpreter path must be listed explicitly.
      - { path: "/usr/local/bin/python3.*" }
      - { path: /sandbox/.venv/bin/python }
      - { path: /sandbox/.venv/bin/python3 }
      - { path: /sandbox/.venv/bin/pip }
      - { path: /app/.venv/bin/python }
      - { path: /app/.venv/bin/python3 }
      - { path: /app/.venv/bin/pip }
      - { path: /usr/local/bin/uv }
      # Managed Python installations from uv python install
      - { path: "/sandbox/.uv/python/**" }

  # Unchanged from default.
  vscode:
    name: vscode
    endpoints:
      - { host: update.code.visualstudio.com, port: 443 }
      - { host: "*.vo.msecnd.net", port: 443 }
      - { host: vscode.download.prss.microsoft.com, port: 443 }
      - { host: marketplace.visualstudio.com, port: 443 }
      - { host: "*.gallerycdn.vsassets.io", port: 443 }
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/wget }
      - { path: "/sandbox/.vscode-server/**" }
      - { path: "/sandbox/.vscode-remote-containers/**" }

  # [agent006] NVIDIA internal GitLab — agent006 installation.
  # agent006 is not yet on a public PyPI index, so each new sandbox installs
  # it via: GIT_SSL_NO_VERIFY=1 uv pip install git+https://oauth2:<token>@gitlab-master.nvidia.com/...
  #
  # GIT_SSL_NO_VERIFY=1 is required because gitlab-master.nvidia.com uses an
  # NVIDIA-internal CA that is absent from the sandbox CA bundle. The IP is
  # pinned to the resolved address of gitlab-master.nvidia.com (as of 2026-03)
  # to partially mitigate MITM risk despite the disabled TLS verification.
  # A MITM would require control of that specific internal IP.
  #
  # Only Git Smart HTTP reads are permitted — git push is not allowed.
  gitlab_agent006:
    name: gitlab-agent006
    endpoints:
      - host: gitlab-master.nvidia.com
        port: 443
        protocol: rest
        tls: terminate
        enforcement: enforce
        allowed_ips: ["10.120.180.120/32"]
        rules:
          - allow:
              method: GET
              path: "/**/info/refs*"
          - allow:
              method: POST
              path: "/**/git-upload-pack"
    binaries:
      - { path: /usr/bin/git }
      - { path: /usr/local/bin/uv }

  # [agent006] NVIDIA internal MCP servers.
  # Agent workflows connect to internal tooling (e.g. Confluence, JIRA) via
  # MCP (Model Context Protocol). These servers are reachable only from the
  # NVIDIA internal network. Only the agent006 Python venv is allowed — no
  # shell or curl — to limit blast radius if the policy is ever abused.
  nvidia_mcp:
    name: nvidia-mcp
    endpoints:
      - { host: maas.stg.astra.nvidia.com, port: 443 }
    binaries:
      - { path: /sandbox/.venv/bin/python }
      - { path: /sandbox/.venv/bin/python3 }
