# Upload core junit + coverage — separate job so artifact upload failures don't block MR
# GitLab's artifact API can return 500 errors intermittently.
# Package test jobs report JUnit inline via artifacts: reports: junit: above.
upload-test-report:
  stage: test
  timeout: 5 minutes  # should complete in <30s; 5m catches zombie runners
  retry:
    max: 2
    when:
      - runner_system_failure
  image:
    name: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
    pull_policy: if-not-present
  tags:
    - os/linux
  needs:
    - job: test-core
      artifacts: true
      optional: true  # test-core may be skipped for util/harbor-only MRs; don't error
  script:
    # Create empty placeholder files if test-core was skipped (e.g. YAML-only MR).
    # GitLab hangs collecting artifacts when referenced files don't exist.
    - test -f test-results.xml && echo "Found test-results.xml" || (echo "No test-results.xml found, creating placeholder" && echo '<?xml version="1.0" encoding="UTF-8"?><testsuites/>' > test-results.xml)
    - test -f coverage.xml && echo "Found coverage.xml" || (echo "No coverage.xml found, creating placeholder" && echo '<?xml version="1.0" encoding="UTF-8"?><coverage/>' > coverage.xml)
  artifacts:
    reports:
      junit: test-results.xml
      # Cobertura XML: annotates MR diff with covered/uncovered lines
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days
    when: always
  allow_failure: true  # Don't block MR if artifact upload fails
  except:
    - schedules  # scheduled pipelines run only opt-in jobs (e.g. integration-return-types)
  only:
    - merge_requests
    - main

# Capability testing - runs nemo_oo_agents against LLM test suite
# Requires NVIDIA_INFERENCE_API_KEY environment variable to be set
# Runs on main commits and on MRs that touch core framework files.
# Skipped for MRs that only change packages/ (benchmark agents, adapters).
# Blocks merge if STABLE tier tests fail (Frontier/Horizon are non-blocking)
capability-test:
  stage: capability
  # DAG: run as soon as test-core finishes (no full-stage wait).
  # Also cascades: if test-core is skipped or fails, this is skipped automatically.
  needs: [test-core]
  image:
    name: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
    pull_policy: if-not-present
  tags:
    - os/linux
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  before_script:
    # --no-extra sandbox: nemoclaw requires manylinux_2_39, CI runners have manylinux_2_36
    - uv sync --all-extras --no-extra sandbox
  script:
    - rm -rf results/ci/ capability-results.zip
    # NVIDIA model aliases (claude-haiku, nemotron3-nano-30b, etc.) resolve
    # via the unifiedllm registry. The `[nvidia]` extra (pulled in by
    # --all-extras above) installs nemo-oo-agents-nvidia, which registers
    # the bundled defaults via entry-point — no env var needed.
    - echo "Running capability tests with NVIDIA models..."
    - |
      uv run python -m eval_pipeline \
        --config tests/capability/config.yaml \
        --models claude-haiku \
        --output-dir results/ci \
        --default_strategy codeact \
        --runs 3 \
        --parallel 40 \
        --timeout 300
    # Parse results and generate metrics report
    - uv run python util/ci/parse_capability_results.py results/ci/ --output metrics.txt
    # Post formatted comment to MR (updates existing comment if present)
    # Uses GITLAB_TOKEN for API access - set this as a CI/CD variable with api scope
    - |
      if [ -n "$CI_MERGE_REQUEST_IID" ]; then
        echo "Posting capability results to MR #$CI_MERGE_REQUEST_IID..."
        uv run python util/ci/post_mr_comment.py \
          results/ci/ \
          --compare-branch "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      else
        echo "Not an MR pipeline, skipping comment"
      fi
    - uv run python -c "import shutil; shutil.make_archive('capability-results', 'zip', 'results', 'ci')"
    # Check for tier promotions - TEMPORARILY DISABLED
    # - |
    #   BRANCH="${CI_COMMIT_BRANCH:-${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}}"
    #   echo "Detected branch: $BRANCH"
    #   if [ "$BRANCH" = "main" ]; then
    #     echo "Checking for tier promotion candidates..."
    #     uv run python util/ci/tier_promotions.py results/ci/ --create-mr || echo "No promotions or MR creation failed"
    #   else
    #     echo "Running tier promotion dry-run..."
    #     uv run python util/ci/tier_promotions.py results/ci/ --create-mr --dry-run || echo "Dry-run complete"
    #   fi
    - uv cache prune --ci
    # Check tier thresholds and block merge if stable tier fails
    - |
      if [ -z "$CI_MERGE_REQUEST_IID" ]; then
        echo "Skipping threshold check (not a merge request)"
        exit 0
      fi

      # Extract tier success rates (as floats)
      STABLE_RATE=$(grep 'capability_success_rate_percent{tier="stable"}' metrics.txt | awk '{print $2}')
      FRONTIER_RATE=$(grep 'capability_success_rate_percent{tier="frontier"}' metrics.txt | awk '{print $2}')
      HORIZON_RATE=$(grep 'capability_success_rate_percent{tier="horizon"}' metrics.txt | awk '{print $2}')

      echo "Tier Results:"
      echo "  Stable: ${STABLE_RATE}% (threshold: ${STABLE_THRESHOLD}%, blocks merge)"
      echo "  Frontier: ${FRONTIER_RATE}% (threshold: ${FRONTIER_THRESHOLD}%, non-blocking)"

      if [ -n "$HORIZON_RATE" ]; then
        HORIZON_PASS=$(awk -v rate="$HORIZON_RATE" -v thresh="$HORIZON_THRESHOLD" 'BEGIN {print (rate > thresh) ? "1" : "0"}')
        if [ "$HORIZON_PASS" = "0" ]; then
          echo "HORIZON TIER FAILED: ${HORIZON_RATE}% < ${HORIZON_THRESHOLD}% - non-blocking"
        else
          echo "Horizon tier passed: ${HORIZON_RATE}% >= ${HORIZON_THRESHOLD}%"
        fi
      fi

      # Only stable tier blocks merge (use awk for float comparison)
      if [ -n "$STABLE_RATE" ]; then
        STABLE_PASS=$(awk -v rate="$STABLE_RATE" -v thresh="$STABLE_THRESHOLD" 'BEGIN {print (rate >= thresh) ? "1" : "0"}')
        if [ "$STABLE_PASS" = "0" ]; then
          echo "STABLE TIER FAILED: ${STABLE_RATE}% < ${STABLE_THRESHOLD}% - blocking merge"
          exit 1
        else
          echo "Stable tier passed: ${STABLE_RATE}% >= ${STABLE_THRESHOLD}%"
        fi
      else
        echo "No stable tier tests found"
      fi
  artifacts:
    reports:
      metrics: metrics.txt  # GitLab metrics (kept for historical tracking)
    paths:
      - capability-results.zip
      - metrics.txt
    expire_in: 7 days
    when: always
  allow_failure: false  # Block merge if stable tier fails
  rules:
    - *no-schedule
    # Always run on main branch commits
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    # On MRs: run only when core framework files change.
    # Skipped for package-only MRs (benchmark agents, adapters) and CI-config-only MRs.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "src/**/*"
        - "tests/**/*"
        - "util/ci/**/*"
        - "conftest.py"
        - "pyproject.toml"
        - "uv.lock"
        - "conftest.py"
      when: always
    - when: never

# Nightly (Tue/Thu) live cross-provider structured-output schema matrix for
# PredictStrategy + CodeAct return types (#232 / #148). Catches provider-side
# schema-validator drift (e.g. Azure tightening strict mode) that the no-network
# unit tests in tests/unifiedllm/ cannot. Makes real gateway calls, so it is NOT
# run on MRs — it is gated to a scheduled pipeline carrying NIGHTLY_INTEGRATION=true.
#
# One-time setup (GitLab UI — cron schedules cannot be declared in this file):
#   Build → Pipeline schedules → New schedule
#     Interval pattern (cron):  0 3 * * 2,4   # 03:00 on Tue & Thu (set the schedule's timezone)
#     Target branch:            main
#     Variable:                 NIGHTLY_INTEGRATION = true
#   Reuses the NVIDIA_INFERENCE_API_KEY CI/CD variable (same one capability-test uses).
#   The tests self-skip if that key is absent, so a misconfigured schedule is a no-op.
integration-return-types:
  stage: capability
  image:
    name: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
    pull_policy: if-not-present
  tags:
    - os/linux
  timeout: 30 minutes
  retry:
    max: 1
    when:
      - runner_system_failure
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  before_script:
    # [nvidia] extra (via --all-extras) registers the model aliases used by the matrix.
    - uv sync --all-extras --no-extra sandbox
  script:
    # -m integration selects the key-gated live matrix (skipped by the default
    #  `-m 'not integration'`). Per-test reruns absorb transient gateway
    #  rate-limits / 5xx without re-running the whole 165-cell job.
    - |
      uv run pytest tests/integration/test_predict_return_types_live.py \
        -m integration -v \
        --reruns 2 --reruns-delay 15 \
        --only-rerun "RateLimit|Too Many Requests|InternalServerError" \
        --junitxml=integration-results.xml
    - uv cache prune --ci
  artifacts:
    reports:
      junit: integration-results.xml
    paths:
      - integration-results.xml
    expire_in: 7 days
    when: always
  rules:
    # Scheduled pipeline carrying NIGHTLY_INTEGRATION=true (cron set to Tue/Thu in the UI).
    - if: $CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_INTEGRATION == "true"
      when: always
    # On-demand: allow a manual run from the pipeline UI (e.g. re-verify after a provider change).
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
    - when: never

# Build & publish on (a) `vX.Y.Z` tags and (b) every push to main.
# Version is derived from `git describe` at build time by uv-dynamic-versioning
# (see [tool.uv-dynamic-versioning] in each workspace pyproject.toml):
#   - On a tag: `X.Y.Z`.
#   - Past a tag: `X.Y.(Z+1).dev<distance>` — PEP 440 dev pre-release that
#     sorts ABOVE the latest stable so `--pre` consumers get the freshest dev.
#   - Before the first tag: falls back to `0.2.0` (`fallback-version`).
# CI has no manual version logic, no sed rewrites, no lockstep enforcement —
# each package declares its own deps in pyproject.toml and the maintainer
# bumps floors when actual incompatibilities are introduced (standard Python).
#
# IMPORTANT: do NOT add `retry:` to the publish jobs — `uv publish` is not
# idempotent against the GitLab Package Registry. A second attempt with the
# same version returns HTTP 400, which is the correct safe-fail behavior.
# To republish a main commit (e.g. transient infra failure), push an empty
# commit so the derived dev version advances rather than retrying the same
# pipeline.
.build-package-base:
  stage: build
  image:
    name: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
    pull_policy: if-not-present
  tags:
    - os/linux
  variables:
    # uv-dynamic-versioning runs `git describe` at build time; needs the full
    # tag history, not the shallow clone GitLab does by default. GIT_DEPTH=0
    # disables the shallow clone; GIT_FETCH_EXTRA_FLAGS=--tags pulls in
    # `vX.Y.Z` tag refs (default fetch only pulls the branch ref).
    GIT_DEPTH: "0"
    GIT_FETCH_EXTRA_FLAGS: "--tags"
  before_script:
    # The uv docker image is `bookworm-slim` and doesn't ship git. dunamai
    # silently falls back to fallback-version if `git` is not on PATH, so
    # install it before `uv build` runs.
    - apt-get update -qq && apt-get install -y -qq git > /dev/null
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([.-][a-zA-Z0-9]+)?$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

build-package-core:
  extends: .build-package-base
  script:
    - uv build --out-dir dist-core
    - uv cache prune --ci
  artifacts:
    paths:
      - dist-core/*.whl
      - dist-core/*.tar.gz
    expire_in: 1 hour

build-package-benchmarks:
  extends: .build-package-base
  script:
    - uv build --package nemo-oo-agents-benchmarks --out-dir dist-bench
    - uv cache prune --ci
  artifacts:
    paths:
      - dist-bench/*.whl
      - dist-bench/*.tar.gz
    expire_in: 1 hour

build-package-cli:
  extends: .build-package-base
  script:
    - uv build --package nemo-oo-agents-cli --out-dir dist-cli
    - uv cache prune --ci
  artifacts:
    paths:
      - dist-cli/*.whl
      - dist-cli/*.tar.gz
    expire_in: 1 hour

# Publish to GitLab package registry on tags and main pushes (matches
# .build-package-base rules:). The same `rules:` block must mirror the
# build base so build/publish jobs are always co-included or co-excluded.
.publish-package-base:
  stage: publish
  image:
    name: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
    pull_policy: if-not-present
  tags:
    - os/linux
  variables:
    UV_PUBLISH_USERNAME: gitlab-ci-token
    UV_PUBLISH_PASSWORD: $CI_JOB_TOKEN
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+([.-][a-zA-Z0-9]+)?$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"

publish-package-core:
  extends: .publish-package-base
  script:
    - uv publish --publish-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist-core/*
  dependencies:
    - build-package-core

publish-package-benchmarks:
  extends: .publish-package-base
  script:
    - uv publish --publish-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist-bench/*
  dependencies:
    - build-package-benchmarks

publish-package-cli:
  extends: .publish-package-base
  script:
    - uv publish --publish-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist-cli/*
  dependencies:
    - build-package-cli

# =============================================================================
# Docker Image Build and Deploy (main branch and MRs)
# Uses Docker-in-Docker - requires runner with privileged = true
# See: https://docs.gitlab.com/ci/docker/using_docker_build/
# =============================================================================

build-docker-images:
  stage: deploy
  image:
    name: docker:24.0.5
    pull_policy: if-not-present
  services:
    - name: docker:24.0.5-dind
      pull_policy: if-not-present
  tags:
    - os/linux
    - docker-build
    - interactive-agents
  variables:
    # TLS certificates directory for secure Docker daemon communication
    DOCKER_TLS_CERTDIR: "/certs"
    # Use overlay2 for better performance
    DOCKER_DRIVER: overlay2
  before_script:
    - docker info
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Create Docker context for current TLS environment (required for buildx with dind)
    # See: https://github.com/docker/buildx/issues/413
    - docker context create tls-environment
    # Create buildx builder using the TLS context
    - docker buildx create tls-environment --name ci-builder --driver docker-container --use
    - docker buildx inspect ci-builder --bootstrap
  script:
    # Build TPM Agent image with registry cache
    - echo "Building TPM Agent image..."
    - |
      docker buildx build \
          --file agents/tpm-agent/Dockerfile \
          --cache-from type=registry,ref=$CI_REGISTRY_IMAGE/tpm-agent:cache \
          --cache-to type=registry,ref=$CI_REGISTRY_IMAGE/tpm-agent:cache,mode=max \
          --tag $CI_REGISTRY_IMAGE/tpm-agent:$CI_COMMIT_SHORT_SHA \
          --tag $CI_REGISTRY_IMAGE/tpm-agent:latest \
          --push \
          .

  after_script:
    # Cleanup builder
    - docker buildx rm ci-builder || true
  rules:
    - *no-schedule
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always  # Auto-deploy on every push to main
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual  # Allow manual trigger on MRs for testing
  allow_failure: true  # Don't block pipeline/auto-merge when not triggered

# Deploy to staging server via SSH
deploy-staging:
  stage: deploy
  needs: [build-docker-images]  # Wait for images to be built
  image:
    name: debian:latest
    pull_policy: if-not-present
  tags:
    - os/linux
    - docker-build
    - interactive-agents
  before_script:
    - command -v ssh-agent >/dev/null || ( apt-get update -y && apt-get install openssh-client -y )
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 400 "$SSH_PRIVATE_KEY"
    - ssh-add "$SSH_PRIVATE_KEY"
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 700 ~/.ssh
  script:
    # Copy docker-compose.yml to server
    - scp deploy/docker-compose.yml ${DEPLOY_USER}@${DEPLOY_SERVER}:~/tpm-agent/docker-compose.yml
    # Pull new images and restart containers
    - ssh ${DEPLOY_USER}@${DEPLOY_SERVER} "
        cd ~/tpm-agent &&
        export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE &&
        export TAG=latest &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker compose pull &&
        docker compose up -d &&
        docker compose ps
      "
  environment:
    name: staging
    url: http://$DEPLOY_SERVER:8001
  rules:
    - *no-schedule
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always  # Auto-deploy on every push to main
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual  # Allow manual trigger on MRs for testing
  allow_failure: true  # Don't block pipeline if deploy fails

# =============================================================================
# Pulse Secret Scanning (NVIDIA's Trufflehog) — NEMOOO-7 / nSpect NSPECT-2MWM-IKT9
# Self-contained: runs the Pulse scanner image directly. We do NOT `include` the
# pstooling/gitlab-templates recipe because that project is access-restricted to
# this project (the CI token 404s on it), which hard-fails pipeline config. The
# scanner image itself IS pullable from the registry, so we invoke it directly.
# Matches how nSpect runs it: filesystem scan, verified results only, JSON,
# fail the pipeline on a finding. Wiki:
# https://nvidia.atlassian.net/wiki/spaces/PRODSEC/pages/2569281281
# =============================================================================
pulse-trufflehog-scan:
  stage: security
  image: gitlab-master.nvidia.com:5005/pstooling/pulse-group/pulse-secret-scanner:1.79
  tags:
    - os/linux
  # GitLab runs `script` in a shell (it does NOT route through the image
  # ENTRYPOINT), so call the scanner binary by its absolute path. Per the
  # image Dockerfile the binary is /usr/bin/pulse-secret-scanner. Args match
  # nSpect: filesystem scan, verified results only, JSON, non-zero on a finding.
  script:
    - /usr/bin/pulse-secret-scanner filesystem . --json --only-verified --fail --allowlist .nspect-allowlist.toml --no-allowlisted-results | tee trufflehog-report.json
  artifacts:
    when: always
    paths:
      - trufflehog-report.json
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "merge_train_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ---------------------------------------------------------------------------
# GitLab Pages — publish the NeMo OO Agents slide deck.
# Pages serves the committed `public/index.html` deck. Runs on the default
# branch where Pages publishes, and manually on MRs for artifact previews.
# ---------------------------------------------------------------------------
pages:
  stage: pages
  image:
    name: debian:bookworm-slim
    pull_policy: if-not-present
  tags:
    - os/linux
    - docker-build
    - interactive-agents
  script:
    - test -f public/index.html
  artifacts:
    paths:
      - public
  rules:
    - *no-schedule
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
