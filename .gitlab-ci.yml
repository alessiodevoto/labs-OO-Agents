variables:
  UV_VERSION: "0.7"
  PYTHON_VERSION: "3.12"
  BASE_LAYER: bookworm-slim
  # Map CI API key to the env var name the unifiedllm registry expects
  NVIDIA_INTERNAL_API_KEY: $NVIDIA_INFERENCE_API_KEY
  # GitLab CI creates a separate mountpoint for the build directory,
  # so we need to copy instead of using hard links.
  UV_LINK_MODE: copy
  # Cache directory for uv
  UV_CACHE_DIR: .uv-cache
  # Don't remove ignored files during git clean (preserves .uv-cache)
  GIT_CLEAN_FLAGS: -ffd
  # Use frozen lockfile — skip re-resolution (git deps fail without git in CI image)
  UV_FROZEN: "1"
  # Tier thresholds for capability tests
  STABLE_THRESHOLD: 60  # Stable tier must pass at 60%+ to block merge
  FRONTIER_THRESHOLD: 60  # Frontier tier is informational, no blocking
  HORIZON_THRESHOLD: 0  # Horizon tier is aspirational, no blocking

# Reusable rule fragment: scheduled pipelines run ONLY jobs that explicitly opt in
# (e.g. integration-return-types). A schedule targeting `main` sets
# CI_COMMIT_BRANCH=main, so without this guard every branch-based job would fire —
# including build-docker-images and deploy-staging. Prepend `- *no-schedule` to a
# job's rules to exclude it from all scheduled pipelines.
.ci-anchors:
  - &no-schedule
    if: $CI_PIPELINE_SOURCE == "schedule"
    when: never

stages:
  - lint
  - test
  - security  # Pulse secret scanning (nSpect / NEMOOO-7)
  - capability  # Optional LLM capability testing
  - build
  - publish
  - deploy  # Docker image build and deployment
  - pages  # GitLab Pages: publish the slide deck

lint:
  stage: lint
  timeout: 10 minutes  # lint takes ~50s; 10m catches zombie runners
  image:
    name: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
    pull_policy: if-not-present
  tags:
    - os/linux
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  before_script:
    # --no-extra sandbox: nemoclaw requires manylinux_2_39, CI runners have manylinux_2_36
    - uv sync --all-extras --no-extra sandbox
  script:
    - echo "Running ruff linting..."
    - uv run ruff check .
    - echo "Running ruff format check..."
    - uv run ruff format --check .
    - uv cache prune --ci
  except:
    - schedules  # scheduled pipelines run only opt-in jobs (e.g. integration-return-types)
  only:
    - merge_requests
    - main

check-frontend-build:
  stage: lint
  image: node:22-slim
  tags:
    - os/linux
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
  script:
    - cd src/nemo_oo_agents/viewer/frontend-react
    - npm ci --ignore-scripts
    - npm run build
    - |
      if ! git diff --quiet dist/; then
        echo "ERROR: frontend-react/dist/ is stale. Run 'npm run build' and commit dist/."
        git diff --stat dist/
        exit 1
      fi
  rules:
    - *no-schedule
    # Always verify on main (dist/ drift would break CI images)
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    # On MRs: only run when frontend source changes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "src/nemo_oo_agents/viewer/frontend-react/src/**/*"
        - "src/nemo_oo_agents/viewer/frontend-react/package*.json"
        - "src/nemo_oo_agents/viewer/frontend-react/*.config.*"
      when: always
    - when: never

# =============================================================================
# Test jobs — split per-package so MRs only run what they affect.
#
# Trigger matrix (on MRs):
#   src/**/*          → test-core + all package tests (core change may break any pkg)
#   tests/**/*        → test-core
#   packages/X/**/*   → test-X only (if X has tests; benchmark packages have none)
#   pyproject.toml    → all test jobs (dep change affects everything)
#   uv.lock           → all test jobs
#   .gitlab-ci.yml    → test-core (verify CI config doesn't break test setup)
#   util/ci/**/*      → test-core (ensures needs: [test-core] satisfied for capability-test)
#
# Packages with no tests (not in pyproject.toml testpaths) — no job needed:
#   evaluation, nat_oo_agents
# =============================================================================

# Shared boilerplate — all test jobs extend this
.test-base:
  stage: test
  timeout: 15 minutes  # Force zombie runners to fail fast (real tests take <5m)
  interruptible: true  # Allow GitLab to auto-cancel when a newer pipeline supersedes this one
  retry:
    max: 2
    when:
      - runner_system_failure
      # Intentionally NOT retrying stuck_or_timeout_failure: zombie runners cause
      # the job to time out, and retrying just re-queues onto more zombie runners
      # (3 × 15 min = 45 min apparent hang). Let it fail fast on first timeout.
  image:
    name: ghcr.io/astral-sh/uv:$UV_VERSION-python$PYTHON_VERSION-$BASE_LAYER
    pull_policy: if-not-present
  tags:
    - os/linux
  cache:
    key:
      files:
        - uv.lock
    paths:
      - $UV_CACHE_DIR
  before_script:
    # --no-extra sandbox: nemoclaw requires manylinux_2_39, CI runners have manylinux_2_36
    - uv sync --all-extras --no-extra sandbox

# Core framework tests — runs tests/ (root), owns coverage tracking.
# INVARIANT: capability-test's changes: ⊆ test-core's changes: so test-core is
# always present in the pipeline whenever capability-test would run (needed for
# capability-test's needs: [test-core] to resolve correctly).
test-core:
  extends: .test-base
  before_script:
    - apt-get update -qq && apt-get install -y -qq ripgrep > /dev/null
    # --no-extra sandbox: nemoclaw requires manylinux_2_39, CI runners have manylinux_2_36
    - uv sync --all-extras --no-extra sandbox
  script:
    - uv run pytest tests/ --ignore=tests/viewer --junitxml=test-results.xml --cov --cov-report=term-missing --cov-report=xml:coverage.xml
    - uv cache prune --ci
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+(?:\.\d+)?)%/'
  artifacts:
    paths:
      - test-results.xml
      - coverage.xml
    expire_in: 1 day
    when: always
  rules:
    - *no-schedule
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "src/**/*"
        - "tests/**/*"
        - "packages/nemo-oo-agents-cli/**/*"
        - "conftest.py"
        - "pyproject.toml"
        - "uv.lock"
        - ".gitlab-ci.yml"
        - "util/ci/**/*"
      when: always
    - when: never

